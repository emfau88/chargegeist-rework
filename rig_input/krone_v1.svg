<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- The Plus charm "Little Crown", in the look of the talisman sheet: thick dark outline, soft shading, no glow. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe683"/>
      <stop offset="0.55" stop-color="#f8c544"/>
      <stop offset="1" stop-color="#e2962a"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c24a"/>
      <stop offset="0.6" stop-color="#e59a2a"/>
      <stop offset="1" stop-color="#c3711c"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff8d2"/>
      <stop offset="0.4" stop-color="#ffd65e"/>
      <stop offset="1" stop-color="#dc8e22"/>
    </radialGradient>
    <radialGradient id="ruby" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb3cf"/>
      <stop offset="0.45" stop-color="#f4508a"/>
      <stop offset="1" stop-color="#a5134b"/>
    </radialGradient>
    <radialGradient id="aqua" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#e2fcff"/>
      <stop offset="0.5" stop-color="#62d5e8"/>
      <stop offset="1" stop-color="#1e7fa0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.3  0 0 0 0 0.05  0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <g id="shape">
      <path d="M46,136 L34,66 L82,104 L120,42 L158,104 L206,66 L194,136 Z"/>
      <circle cx="34" cy="60" r="13"/>
      <circle cx="120" cy="36" r="15"/>
      <circle cx="206" cy="60" r="13"/>
      <rect x="36" y="126" width="168" height="44" rx="14"/>
    </g>
  </defs>

  <!-- the outer contour: every part filled dark and drawn thicker -->
  <use href="#shape" fill="#1a1222" stroke="#1a1222" stroke-width="16" stroke-linejoin="round"/>

  <g stroke="#1a1222" stroke-width="4" stroke-linejoin="round">
    <path d="M46,136 L34,66 L82,104 L120,42 L158,104 L206,66 L194,136 Z" fill="url(#gold)"/>
    <!-- the right side lies in shade -->
    <path d="M120,42 L158,104 L206,66 L194,136 L128,136 Z" fill="#c4741c" fill-opacity="0.28" stroke="none"/>
    <path d="M48,128 L40,82 L60,98 Z" fill="#fff6cf" fill-opacity="0.6" stroke="none"/>
    <path d="M112,96 L120,60 L126,94 Z" fill="#fff6cf" fill-opacity="0.45" stroke="none"/>
    <circle cx="34" cy="60" r="13" fill="url(#ball)"/>
    <circle cx="120" cy="36" r="15" fill="url(#ball)"/>
    <circle cx="206" cy="60" r="13" fill="url(#ball)"/>
    <rect x="36" y="126" width="168" height="44" rx="14" fill="url(#band)"/>
  </g>
  <path d="M50,135 H190" stroke="#fff1bf" stroke-opacity="0.75" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="29" cy="55" rx="4.5" ry="3" fill="#ffffff" fill-opacity="0.85" transform="rotate(-30 29 55)"/>
  <ellipse cx="114" cy="30" rx="5" ry="3.4" fill="#ffffff" fill-opacity="0.85" transform="rotate(-30 114 30)"/>
  <ellipse cx="201" cy="55" rx="4.5" ry="3" fill="#ffffff" fill-opacity="0.85" transform="rotate(-30 201 55)"/>

  <!-- the gems on the band: a heart in the middle, for Heartlight -->
  <g stroke="#1a1222" stroke-width="4" stroke-linejoin="round">
    <circle cx="70" cy="149" r="9.5" fill="url(#aqua)"/>
    <circle cx="170" cy="149" r="9.5" fill="url(#aqua)"/>
    <path transform="translate(120 152) scale(1.35)" d="M0,10 C-14,1 -14,-11 -6.5,-11.5 C-2.5,-11.8 0,-9 0,-6.5 C0,-9 2.5,-11.8 6.5,-11.5 C14,-11 14,1 0,10 Z" fill="url(#ruby)" stroke-width="3"/>
  </g>
  <ellipse cx="67" cy="145.5" rx="3.2" ry="2.2" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="167" cy="145.5" rx="3.2" ry="2.2" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="112" cy="143" rx="4" ry="2.6" fill="#ffffff" fill-opacity="0.85" transform="rotate(-25 112 143)"/>

  <!-- a light grain, as on the painted charms -->
  <use href="#shape" filter="url(#grain)" fill="#000"/>
</svg>
